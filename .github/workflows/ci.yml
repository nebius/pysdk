name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - api-auto-update

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install project and documentation dependencies
        run: python -m pip install '.[generators]' pytest

      - name: Test documentation discovery
        run: python -m pytest -q tests/test_gendoc.py

      - name: Build API documentation
        run: make gen-doc

      - name: Upload documentation preview
        if: ${{ !env.ACT }}
        id: docs-preview
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-${{ github.event.pull_request.number || github.run_id }}
          path: docs/generated
          if-no-files-found: error
          retention-days: 14

      - name: Link documentation preview
        if: ${{ !env.ACT }}
        env:
          ARTIFACT_URL: ${{ steps.docs-preview.outputs.artifact-url }}
        run: |
          {
            echo "### Documentation preview"
            echo
            echo "[Download the generated site]($ARTIFACT_URL) (retained for 14 days)."
            echo "Extract the archive and open \`apiReference.html\` in a browser."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run tox
        env:
          NEBIUS_E2E_CONFIG_B64: ${{ secrets.NEBIUS_E2E_CONFIG_B64 }}
        run: |
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            tox -e test_earliest,test,lint,type,type_consumer,format
          else
            tox -e test
          fi
