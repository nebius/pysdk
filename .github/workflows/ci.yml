name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PYTHONFAULTHANDLER: "1"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Test CI installation helper
        run: python -m unittest scripts.test_ci

      - name: Install project and documentation dependencies
        run: python scripts/ci.py install '.[docs]' pytest

      - name: Test documentation discovery
        run: python -m pytest -q tests/test_gendoc.py

      - name: Build API documentation
        run: make gen-doc

      - name: Upload documentation preview
        if: ${{ !env.ACT }}
        id: docs-preview
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-${{ github.event.pull_request.number || github.run_id }}
          path: docs/generated
          if-no-files-found: error
          retention-days: 14

      - name: Link documentation preview
        if: ${{ !env.ACT }}
        env:
          ARTIFACT_URL: ${{ steps.docs-preview.outputs.artifact-url }}
        run: |
          {
            echo "### Documentation preview"
            echo
            echo "[Download the generated site]($ARTIFACT_URL) (retained for 14 days)."
            echo "Extract the archive and open \`apiReference.html\` in a browser."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.python-version == '3.10' && 'Unit tests (3.10)' || format('test ({0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python scripts/ci.py install --upgrade pip
          python scripts/ci.py install tox==4.65.0

      - name: Run tox
        env:
          NEBIUS_E2E_CONFIG_B64: ${{ secrets.NEBIUS_E2E_CONFIG_B64 }}
        run: |
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            python scripts/ci.py tox test_earliest test
          else
            python scripts/ci.py tox test
          fi

  quality:
    name: Quality (${{ matrix.tox-env }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tox-env: [lint, type, type_consumer, format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install tox
        run: python scripts/ci.py install tox==4.65.0
      - name: Run tox
        run: python scripts/ci.py tox ${{ matrix.tox-env }}

  test-complete:
    name: test (3.10)
    if: ${{ always() }}
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check test and quality results
        if: ${{ !env.ACT }}
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$TEST_RESULT" = success && test "$QUALITY_RESULT" = success
